# Read the Docs configuration file.
# Required since September 2023: without this file builds fail and Read the
# Docs keeps serving the last successful build.
# See https://docs.readthedocs.io/en/stable/config-file/v2.html

version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"

sphinx:
  configuration: docs/source/conf.py
  fail_on_warning: false

python:
  install:
    # Sphinx, the extensions used by conf.py, and scintools' runtime
    #   dependencies. The package itself is deliberately NOT pip-installed
    #   here: setup.py pins numpy<1.23.0, which has no wheels for modern
    #   Python and would either fail to build or downgrade numpy in the
    #   docs environment. conf.py instead puts the repository root on
    #   sys.path (for autodoc) and PYTHONPATH (for the jupyter-execute
    #   kernel), so `import scintools` works without installing.
    - requirements: docs/requirements.txt
